@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#09060a;--bg2:#150a11;--o1:#d63a79;--o2:#6e1a45;--o3:#9c2f63;--glass:rgba(255,255,255,.06);--glass-hi:rgba(255,255,255,.15);--edge:rgba(255,255,255,.38);--glass-b:rgba(255,255,255,.2);--ink:#f8eff3;--mut:#d6c1cc;--acc:#ff7fb2;--acc-d:#e24a88;--on:#1c0a12;--ok:#82dcab;--bad:#f2928f;--shadow:0 12px 40px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#09060a;--bg2:#150a11;--o1:#d63a79;--o2:#6e1a45;--o3:#9c2f63;--glass:rgba(255,255,255,.06);--glass-hi:rgba(255,255,255,.15);--edge:rgba(255,255,255,.38);--glass-b:rgba(255,255,255,.2);--ink:#f8eff3;--mut:#d6c1cc;--acc:#ff7fb2;--acc-d:#e24a88;--on:#1c0a12;--ok:#82dcab;--bad:#f2928f;--shadow:0 12px 40px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg1)}
body{margin:0;min-height:100vh;color:var(--ink);font:var(--font-3)/1.45 Inter,system-ui,sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));padding:0 var(--space-4) 112px}
.orbs{position:fixed;inset:0;overflow:hidden;z-index:-1;pointer-events:none}
.orbs i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(48px);opacity:.6;animation:drift 44s ease-in-out infinite alternate}
.orbs i:nth-child(1){background:var(--o1);top:-14vmax;left:-10vmax}.orbs i:nth-child(2){background:var(--o2);right:-14vmax;top:18vh;animation-duration:56s}.orbs i:nth-child(3){background:var(--o3);bottom:-18vmax;left:22vw;animation-duration:50s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.97);filter:blur(8px)}}
@keyframes sweep{0%,70%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96);filter:blur(6px)}}
@keyframes pulse{50%{opacity:.45}}
main{max-width:1120px;margin:0 auto}
h1,h2,h3{font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:var(--font-5)}h2{font-size:var(--font-4)}h3{font-size:var(--font-4)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.glass{position:relative;overflow:hidden;background:var(--glass);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--glass-b);border-radius:var(--r);box-shadow:var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .7s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.22),transparent 65%)}
.glass:hover::before{opacity:1}
.glass::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.2) 50%,transparent 58%);transform:translateX(-130%);animation:sweep 18s ease-in-out infinite}
.glass:nth-child(2n)::after{animation-delay:2s}.glass:nth-child(3n)::after{animation-delay:4s}
.enter .glass{animation:rise 1.3s cubic-bezier(.22,1,.36,1) both}.enter .glass:nth-child(2){animation-delay:.12s}.enter .glass:nth-child(3){animation-delay:.24s}.enter .glass:nth-child(4){animation-delay:.36s}.enter .glass:nth-child(5){animation-delay:.48s}.enter .glass:nth-child(6){animation-delay:.6s}
.pad{padding:var(--space-4)}
.top{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);padding:var(--space-5) 0 var(--space-4)}
.label{font-size:var(--font-2);color:var(--mut)}.value{font-size:var(--font-4);font-weight:600;display:block}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:44px;padding:0 var(--space-4);background:linear-gradient(135deg,var(--acc),var(--acc-d));color:var(--on);border:0;border-radius:14px;cursor:pointer;text-decoration:none;font:inherit;font-size:var(--font-2);font-weight:600;box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 32%,transparent);transition:transform .5s cubic-bezier(.22,1,.36,1),filter .5s,background .5s,color .5s,box-shadow .5s}
button:hover:not(:disabled),.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}button:disabled{opacity:.5;cursor:not-allowed}
.btn--ghost{background:var(--glass);color:var(--ink);border:1px solid var(--glass-b);box-shadow:none}.btn--sm{padding:0 var(--space-3)}
input,select,textarea{font:inherit;color:var(--ink);width:100%;min-height:44px;padding:var(--space-2) var(--space-3);border:1px solid var(--glass-b);border-radius:12px;background:var(--glass);margin:var(--space-1) 0 var(--space-3)}
input[type=color]{padding:2px;height:44px}
label{font-size:var(--font-2);color:var(--mut);display:block}
.row{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap}.row--between{justify-content:space-between}

function cfgSet(k,el){const v=k=='buffer'?Math.min(120,Math.max(0,+el.value||0)):el.value,c={...S.cfg,[k]:v},m=$('#cmsg');
 if(k!='buffer'&&(!v||tm(c.start)>=tm(c.end))){m.textContent='O início precisa ser antes do fim.';el.value=S.cfg[k];el.setAttribute('aria-invalid','true');return}
 el.removeAttribute('aria-invalid');m.textContent='';S.cfg[k]=v;S.cfg.u=Date.now();save()}
function bkJson(){const c={...S,cfg:{...S.cfg}};delete c.cfg.wa;delete c.cfg.fb;return JSON.stringify(c)}
const bkHint=(m,err)=>{const h=$('#hint');if(h){h.className='hint'+(err?' hint--error':'');h.textContent=m}};
function bkDialog(){const d=$('#dlg');d.oninput=d.onchange=null;d.setAttribute('aria-labelledby','dlgt');
 d.innerHTML=`<h3 id="dlgt">Backup</h3><p class="label">Exporte seus dados ou importe um backup. As chaves do WhatsApp e da nuvem não entram.</p><textarea id="bk" rows="6" aria-label="Texto do backup"></textarea><div class="acts"><button onclick="bkCopy()">Copiar backup</button><button class="btn--ghost" onclick="bkFile()">Baixar arquivo</button><label class="btn btn--ghost">Escolher arquivo<input type="file" accept=".json,application/json" hidden onchange="bkRead(this)"></label><button class="btn--ghost" onclick="bkImport()">Importar do texto</button></div><div id="hint" class="hint" aria-live="polite" style="margin-top:var(--space-3)"></div><button class="btn--ghost" style="width:100%" onclick="dlg.close()">Fechar</button>`;
 $('#bk').value=bkJson();d.showModal()}
async function bkCopy(){try{await navigator.clipboard.writeText($('#bk').value);S.cfg.bkAt=Date.now();persist();bkHint('✓ Backup copiado. Guarde em um lugar seguro.')}catch(e){$('#bk').select();bkHint('Selecione o texto e copie.')}}
function bkFile(){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#bk').value],{type:'application/json'}));a.download='backup-studio-bia-alonso-'+iso(new Date())+'.json';a.click();S.cfg.bkAt=Date.now();persist();bkHint('✓ Arquivo gerado.')}catch(e){bkHint('Não consegui gerar o arquivo. Use "Copiar backup".',1)}}
function bkRead(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#bk').value=String(r.result).slice(0,2e6);bkHint('Arquivo carregado. Toque em "Importar do texto".')};r.readAsText(f)}
function bkImport(){let d;try{d=JSON.parse($('#bk').value)}catch(e){return bkHint('O texto não é um backup válido.',1)}
 const n=normalize(d);if(!n.clients.length&&!n.appts.length&&!n.tx.length&&!n.services.length)return bkHint('Esse backup está vazio.',1);
 if(!confirm('Substituir os dados deste aparelho pelo backup? Isso não pode ser desfeito.'))return;
 const old=Object.keys(H),keep={wa:S.cfg.wa,fb:S.cfg.fb,bkAt:S.cfg.bkAt},now=Date.now();
 for(const T of TB)n[T].forEach(r=>r.u=now);n.cfg={...n.cfg,...keep,u:now};n.del={...(S.del||{})};
 S=n;for(const k of old){const[T,id]=k.split(':');if(!S[T].some(r=>r.id==id))S.del[k]=now}
 rehash();persist();fbQueue();$('#dlg').close();render();toast('Backup importado.')}
render(1);showLock();
/* whatsapp automatico (servidor proprio) */
async function wcall(path,body){const w=S.cfg.wa;if(!w||!w.url)throw new Error('Informe o endereço do servidor.');const r=await fetch(w.url.replace(/\/$/,'')+path,{method:body?'POST':'GET',headers:{'content-type':'application/json','x-app-key':w.key||''},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error('O servidor respondeu '+r.status+(r.status==401?' (chave incorreta).':'.'));return r.json()}
const wmsg=t=>{const e=$('#wmsg');if(e)e.textContent=t};
const werr=e=>wmsg(/fetch|network/i.test(e.message)?'Não consegui falar com o servidor. Se o app está no claude.ai, o ambiente bloqueia essa conexão: hospede o app no seu endereço (veja o LEIA-ME).':e.message);
function queueSync(){if(!S.cfg.wa?.url)return;clearTimeout(wt);wt=setTimeout(wsync,2500)}
async function wsync(){try{const td=iso(new Date());await wcall('/sync',{appts:S.appts.filter(a=>a.date>=td).map(a=>({id:a.id,date:a.date,start:a.start,status:a.status,name:cl(a.clientId).name,phone:cl(a.clientId).phone||'',service:sv(a.serviceId).name}))});
 const st=await wcall('/status');let ch=0;st.forEach(x=>{const a=S.appts.find(y=>y.id==x.id);if(!a)return;if(x.reminded&&!a.sent){a.sent=true;ch++}if(x.reply&&a.reply!=x.reply){a.reply=x.reply;ch++}if(x.reply=='confirmed'&&a.status=='awaiting'){a.status='confirmed';ch++}});
 wmsg('✓ Sincronizado às '+new Date().toLocaleTimeString('pt-BR'));if(ch){persist();fbQueue();render()}}catch(e){werr(e)}}
function wsave(){S.cfg.wa={url:$('#wu').value.trim(),key:$('#wk').value};persist();wmsg('Sincronizando…');wsync()}
async function wtest(){const p=prompt('WhatsApp para o teste (com DDD):');if(!p)return;wmsg('Enviando teste…');try{const r=await wcall('/test',{phone:p,name:'Teste'});wmsg(r.ok?'✓ Teste enviado. Confira o WhatsApp.':'A Meta recusou: '+(r.body?.error?.message||'erro desconhecido'))}catch(e){werr(e)}}
setInterval(()=>{if(S.cfg.wa?.url)wsync()},300000);
if(S.cfg.wa?.url)wsync();
/* nuvem: Firebase Firestore via REST, sem login (mescla por registro) */
const fbmsg=t=>{const e=$('#fmsg');if(e)e.textContent=t};
const fbErr=e=>fbmsg(/fetch|network/i.test(e.message)?'Não consegui falar com o Firebase. Se o app está no claude.ai, o ambiente bloqueia essa conexão: abra a versão hospedada (veja o LEIA-ME-FIREBASE).':e.message);
const fbUrl=()=>{const f=S.cfg.fb;return'https://firestore.googleapis.com/v1/projects/'+encodeURIComponent(f.p)+'/databases/(default)/documents/studios/'+f.s+'?key='+encodeURIComponent(f.k)};
const fbSnap=()=>{const c={...S,cfg:{...S.cfg}};delete c.cfg.wa;delete c.cfg.fb;delete c.meta;return JSON.stringify(c)};
const normData=d=>{const r=normalize(d);delete r.cfg.wa;delete r.cfg.fb;return r};
function fbQueue(){if(!S.cfg.fb?.s)return;clearTimeout(ft);ft=setTimeout(fbSync,3000)}
async function fbSync(){if(!S.cfg.fb?.s||fbusy)return;fbusy=true;try{
 for(let n=0;n<3;n++){
  const r=await fetch(fbUrl());let rd=null,ut='';
  if(r.status!=404){if(!r.ok)throw new Error('A nuvem respondeu '+r.status+(r.status==403?' (confira se as regras foram publicadas).':'.'));const j=await r.json();ut=j.updateTime||'';try{rd=normData(JSON.parse(j.fields.data.stringValue))}catch(e){throw new Error('Os dados da nuvem estão ilegíveis.')}}
  if(rd){const m=merge(S,rd);if(sig(m)!=sig(S)){const keep={wa:S.cfg.wa,fb:S.cfg.fb,bkAt:S.cfg.bkAt};S=normalize(m);S.cfg={...S.cfg,...keep};rehash();persist();render()}if(sig(S)==sig(rd))break}
  const snap=fbSnap();if(snap.length>900000)throw new Error('Os dados passaram do limite da nuvem (900 KB). Faça um backup e apague registros antigos.');
  const p=await fetch(fbUrl()+'&updateMask.fieldPaths=data&updateMask.fieldPaths=updatedAt&updateMask.fieldPaths=v'+(ut?'&currentDocument.updateTime='+encodeURIComponent(ut):'&currentDocument.exists=false'),{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({fields:{data:{stringValue:snap},updatedAt:{integerValue:String(Date.now())},v:{integerValue:'2'}}})});
  if(p.ok)break;
  if(n<2&&[400,404,409,412].includes(p.status))continue;
  throw new Error('Não consegui gravar na nuvem ('+p.status+(p.status==403?'): confira as regras.':').'))
 }
 fbmsg('✓ Sincronizado às '+new Date().toLocaleTimeString('pt-BR'))
}catch(e){fbErr(e)}fbusy=false}
function fbOn(){const p=$('#fp').value.trim(),k=$('#fk').value.trim();if(!p||!k)return fbmsg('Informe o ID do projeto e a chave da API.');
 const s=S.cfg.fb?.s||[...crypto.getRandomValues(new Uint8Array(20))].map(b=>b.toString(16).padStart(2,'0')).join('');
 S.cfg.fb={p,k,s};persist();fbmsg('Conectando…');fbSync().then(()=>{if($('#fp'))render()})}
function fbJoin(){let c;try{c=JSON.parse(atob($('#fn').value.trim()))}catch(e){}if(!c||!c.p||!c.k||!c.s||c.s.length<32)return fbmsg('Código inválido.');
 if(!confirm('Os dados deste aparelho serão combinados com os da nuvem. Continuar?'))return;S.cfg.fb={p:String(c.p),k:String(c.k),s:String(c.s)};persist();fbmsg('Baixando dados…');fbSync().then(()=>{if($('#fn'))render()})}
async function fbCopy(){const i=$('#fc');try{await navigator.clipboard.writeText(i.value);fbmsg('✓ Código copiado.')}catch(e){i.select();fbmsg('Selecione e copie o código acima.')}}
setInterval(fbSync,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)fbSync()});
fbSync();
</script>
